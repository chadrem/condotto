# condotto.example.toml — Condotto's single configuration file.
#
# Copy this to `condotto.toml` and fill it in:
#
#     cp condotto.example.toml condotto.toml
#
# `condotto.toml` is gitignored because it holds secrets (the Slack tokens live
# right here). This is the ONE file to configure — it replaces the old scattered
# .env / condotto.repos.json / condotto.roles.json / CONDOTTO_* setup.
#
# Every value can also be supplied (or overridden) by an environment variable;
# the env var always wins. Those overrides are noted inline. Paths may start with
# `~/` (expands to your home directory).
#
# TOML note: the top-level keys below (`architects`) MUST stay ABOVE the first
# [section] header — in TOML a bare key written after a [table] belongs to that
# table. Keep new top-level keys up here; put everything else in its [section].

# ---------------------------------------------------------------------------
# Architects — surface-qualified principals ("slack:U0123ABC") with command
# authority: only an architect's message runs the agent. Everyone else's is kept
# and carried into the next architect turn as context, so the thread stays whole.
# Architects also assign/stop sessions and delegate roles at runtime.
# Find a user's ID in Slack: profile → ⋯ → "Copy member ID".
# WITHOUT at least one architect, nobody can drive the agent at all.
# Env override/append: CONDOTTO_ARCHITECTS (comma/space separated).
architects = [
  # "slack:U0123ABC",
]

# Whether architects can delegate roles at runtime with `@Condotto grant` /
# `@Condotto revoke`. Set false to pin every role to this file: the commands are
# refused, and any grant made earlier is deleted (and audited) at the next boot.
# runtime_grants = true

# ---------------------------------------------------------------------------
# Slack app credentials (required to run the daemon).
# Create the app per the README ("Create the Slack app"). Env overrides: SLACK_BOT_TOKEN / SLACK_APP_TOKEN.
[slack]
bot_token = "xoxb-your-bot-token"   # Bot User OAuth Token (starts xoxb-)
app_token = "xapp-your-app-token"   # App-Level Token for Socket Mode (starts xapp-)

# How the agent authenticates to Anthropic. Pick by how many people drive sessions.
#
#   "api_key"      An API key from Claude Console (https://platform.claude.com/).
#                  The default, and what you want for a team: it is the documented
#                  path for building on the Agent SDK, and it is rotatable and
#                  spend-cappable. Put the key in ANTHROPIC_API_KEY — it never has
#                  to live in this file.
#   "subscription" Your machine's Claude login (keychain OAuth, or
#                  CLAUDE_CODE_OAUTH_TOKEN on a headless box). Anthropic scopes
#                  this to ordinary individual use of Claude Code and the Agent
#                  SDK, so it is the single-operator path: one architect driving
#                  their own sessions. Fully supported — just not for teams. With
#                  more than one principal able to drive sessions the daemon warns
#                  at boot and keeps going.
#
# Omit this section entirely and the mode is inferred: api_key when a key is
# available, subscription otherwise. See the README ("Authenticate Claude").
[auth]
mode = "api_key"
# api_key = "sk-ant-..."   # Optional and NOT recommended — prefer ANTHROPIC_API_KEY
#                          # in the environment. If set here, it outranks the env var.

# Optional richer role mappings beyond the architects above — e.g. an architect
# locked to one channel's scope. Most setups don't need this; `architects` above
# is the quick path. Roles delegated at runtime with `@Condotto grant` persist in
# SQLite and are NOT listed here.
#
# There are only two roles. An architect sets the agent working; everyone else is
# a member, who talks in the thread and is carried into the next architect turn.
# [[roles]]
# principal = "slack:U0000AAA"
# role = "member"          # architect | member
# scope = "C0123CHANNEL"   # a Slack channel id, or "*" for everywhere (default)

# ---------------------------------------------------------------------------
# Filesystem paths. Env overrides: CONDOTTO_DB_PATH / CONDOTTO_WORKTREES_ROOT /
# CONDOTTO_MEMORY_ROOT.
[paths]
db = "condotto.sqlite"                    # SQLite store (audit log, sessions, roles)
worktrees_root = "~/tmp/condotto-worktrees"  # where per-session git worktrees live
                                            # (absolute & stable — moving a live
                                            #  session's worktree loses the session)
memory_root = "~/.condotto/memory"          # durable agent memory, per (repo, channel).
                                            # Unlike a worktree this OUTLIVES the
                                            # session that wrote it — that is the
                                            # point — so don't put it somewhere
                                            # disposable. Memory is on by default,
                                            # so this path gets used out of the box.

# ---------------------------------------------------------------------------
# Daemon-wide defaults. Each is used when a repo (below) doesn't set its own.
#
# The shipped values below are medium effort with subagents and workflows on. Change
# any of them here, per repo, or per thread in Slack.
[defaults]
model = "opus"              # implementer model token: opus | sonnet | fable.
                            #   `opus` is Claude Opus 5.5.
                            #   Env override: CONDOTTO_DEFAULT_MODEL
effort = "medium"           # reasoning effort: low | medium | high | xhigh | max.
                            #   Each step up costs meaningfully more. Raise it to
                            #   high, or xhigh (Anthropic's recommendation for
                            #   demanding coding and agentic work), if your
                            #   threads need it.
                            #   Env override: CONDOTTO_DEFAULT_EFFORT
subagents = true            # the agent can fan out to subagents for parallel
                            #   exploration. They are confined to the worktree
                            #   exactly as the main agent is; the main agent makes
                            #   the edits, so one agent holds the whole change.
                            #   Env override: CONDOTTO_SUBAGENTS=off|false|0|no
memory = true               # durable notes the agent keeps per (repo, channel),
                            #   loaded at the start of every later thread in that
                            #   channel. On by default: without it every thread
                            #   starts from zero and the install never seems to
                            #   learn. Set false here to opt out everywhere.
                            #   Env override: CONDOTTO_MEMORY=off|false|0|no
workflows = true            # the agent can launch multi-agent workflows for big
                            #   cross-cutting jobs. Workflow agents are confined
                            #   to the worktree, exactly like the main agent.
                            #   Env override: CONDOTTO_WORKFLOWS=off|false|0|no
# cost_cap_usd = 50         # per-thread cost ceiling. COMMENTED OUT ON PURPOSE:
                            #   with no value there is no ceiling, which is the
                            #   default. A cap that pauses healthy work mid-task
                            #   is worse than no cap — the thread stalls and
                            #   someone has to find an architect. Set it here if
                            #   you want every thread to start with one; an
                            #   architect can set one per thread with
                            #   `@Condotto budget <usd>`. Your real backstop is
                            #   the spend cap in Claude Console.
                            #   Env override: CONDOTTO_COST_CAP_USD
max_concurrent_turns = 6    # cap on harness turns running at once across all
                            #   sessions. Env override: CONDOTTO_MAX_CONCURRENT_TURNS

# ---------------------------------------------------------------------------
# How long threads last. A thread nobody has spoken in is warned, then stopped,
# and a stopped session is deleted a while later: its worktree, its branch and
# the conversation. Every step is announced in the thread, including any
# uncommitted or unpushed work it would lose.
# Re-assigning the thread before the deletion picks it back up.
[cleanup]
warn_after_hours = 24       # post a warning after this long with no activity.
                            #   Env override: CONDOTTO_IDLE_WARN_HOURS
stop_after_hours = 36       # stop the session after this long. Must be more
                            #   than warn_after_hours. 0 turns idle stops off.
                            #   Env override: CONDOTTO_IDLE_STOP_HOURS
keep_stopped_days = 7       # delete a stopped session this long after it stops,
                            #   however it stopped. `@Condotto stop clean` uses a
                            #   shorter 24 hours. 0 keeps sessions stopped from
                            #   then on until someone runs `stop clean`; one that
                            #   already has a deletion date keeps it.
                            #   Env override: CONDOTTO_KEEP_STOPPED_DAYS

# ---------------------------------------------------------------------------
# Sandbox mode (optional). Runs the agent as its own Unix user, so its file
# permissions — not Condotto's checks alone — keep it away from this file, the
# SQLite store and other threads' state. The daemon must run as root inside a
# container holding only CAP_SETUID, CAP_SETGID and CAP_KILL; see the README,
# "Running sandboxed". All three keys or none. Requires memory = false above, and
# turns remote control off.
# [sandbox]
# agent_uid = 1001                # the agent's uid (not 0)
# agent_gid = 1001                # the agent's gid (not 0)
# agent_home = "/home/agent"      # absolute; must be writable by agent_uid

# ---------------------------------------------------------------------------
# Repos Condotto can be pointed at. Assign one with `/condotto assign <name>`.
#
# REQUIRED: declare at least one. There is no default repo — Condotto only ever
# works in a repo you name here, and it refuses to start if this section is empty.
# Names must be unique.
#
# MONOREPOS: declare the repo ONCE here; pick the sub-project when you assign —
# `/condotto assign webapp/apps/report` starts the agent in `apps/report` (the
# whole worktree stays readable and writable, so shared packages are still in
# reach). Commands the agent runs land IN that sub-project; it steps up to the
# root itself when the job needs the root.
#
# Starting out, point your first entry at a THROWAWAY clone rather than a repo you
# care about. Sessions only ever see COMMITTED content (each runs in a
# fresh git worktree), so a repo's working tree, untracked files, and .gitignored
# files are never visible to the agent.

# [[repos]]
# name = "webapp"                 # simple identifier used by /condotto assign
# path = "~/Projects/webapp"      # absolute path to the git repo (required)
# default_branch = "main"         # base branch for session worktrees (default "main")
#                                 # Every repo loads its own CLAUDE.md, skills and
#                                 # .claude config. There is no switch for that.
# memory = true                   # durable memory for this repo (ON by default;
#                                 #   set false to opt this one repo out):
#                                 #   markdown notes it keeps about the codebase and
#                                 #   picks up again in LATER threads. Scoped per
#                                 #   (repo, channel) — threads in one channel share
#                                 #   what they learn, another channel starts clean.
#                                 #   Your call, not the agent's: what one thread
#                                 #   writes lands in the system prompt of every later
#                                 #   thread in that channel. Every write is audited,
#                                 #   and the agent's shell cannot reach the directory.
# cost_cap_usd = 25               # per-thread cost ceiling for this repo. Omit to
#                                 #   inherit [defaults].cost_cap_usd, which is
#                                 #   itself unset (no ceiling) by default.
# instructions = """
# Use pnpm, never npm. Run `pnpm test` before you say a change works.
# """                             # appended to every session's system prompt for
#                                 #   this repo, labelled as operator instructions.
# default_model = "sonnet"        # per-repo default model token (overrides [defaults]).
# default_effort = "high"         # per-repo default effort (overrides [defaults]).

# subagents = false               # per-repo harness posture (overrides [defaults]).
# workflows = false               #   Omit both to inherit the daemon default —
#                                 #   omitted is NOT the same as `false`. Use these
#                                 #   to run a sandbox repo at full multi-agent
#                                 #   strength while a repo you care about stays
#                                 #   quieter and cheaper. `workflows` implies
#                                 #   `subagents`, so asking for workflows alone
#                                 #   still starts the session with subagents on.
